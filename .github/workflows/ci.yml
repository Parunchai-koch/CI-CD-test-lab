name: Build and push docker image to dockerhub
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4 #download the project code from the repository
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{vars.DOCKERHUB_USERNAME}}/task-app:${{github.sha}} .
      - name: Push docker image
        run: docker push ${{vars.DOCKERHUB_USERNAME}}/task-app:${{github.sha}}
      - name: update helm values
        env:
          IMAGE_TAG: ${{github.sha}}

        run: |
          sed -i "s|^  tag:.*|  tag: \"$IMAGE_TAG\"|" helm/task-app/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/task-app/values.yaml

          if git diff --cached --quiet; then
              echo "Image tag is already up to date"
              exit 0
          fi

          git commit -m "Update app image to $IMAGE_TAG"
          git push origin HEAD:main
