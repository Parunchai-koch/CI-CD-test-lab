name: Publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: image
        name: Calculate immutable image tag
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build release image for linux/amd64 and load it locally
        run: docker buildx build --platform linux/amd64 --load -t "${{ steps.image.outputs.name }}" --build-arg VCS_REF="$GITHUB_SHA" --build-arg VCS_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Start release image
        run: docker run --detach --name task-app-release --init -p 127.0.0.1:8080:8080 "${{ steps.image.outputs.name }}"
      - name: Smoke test exact release image
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Print container logs on failure
        if: failure()
        run: docker logs task-app-release || true
      - name: Remove temporary container
        if: always()
        run: docker rm --force task-app-release || true
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image and record digest
        run: |
          docker push "${{ steps.image.outputs.name }}"
          digest="$(docker buildx imagetools inspect "${{ steps.image.outputs.name }}" --format '{{.Manifest.Digest}}')"
          {
            echo '## Published image'
            echo
            echo "- Image: \`${{ steps.image.outputs.name }}\`"
            echo "- Digest: \`${digest}\`"
            echo "- Platform: \`linux/amd64\`"
          } >> "$GITHUB_STEP_SUMMARY"
