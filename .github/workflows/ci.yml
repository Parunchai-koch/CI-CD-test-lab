name: Build and push docker image to dockerhub
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4 #download the project code from the repository
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/task-app:${{github.sha}} .
      - name: Push docker image
        run: docker push ${{secrets.DOCKER_USERNAME}}/task-app:${{github.sha}}
