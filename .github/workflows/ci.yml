name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Build linux/amd64 image
        run: docker build --platform linux/amd64 -t task-app:ci --build-arg VCS_REF="$GITHUB_SHA" --build-arg VCS_SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
      - name: Start image
        run: docker run --detach --name task-app-ci --init -p 127.0.0.1:8080:8080 task-app:ci
      - name: Smoke test image
        run: bash scripts/smoke.sh http://127.0.0.1:8080
      - name: Print container logs on failure
        if: failure()
        run: docker logs task-app-ci || true
      - name: Remove temporary container
        if: always()
        run: docker rm --force task-app-ci || true
